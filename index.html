<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Hypertrophy Coach</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0D9488;
            --primary-dark: #0f766e;
            --primary-light: #5eead4;
            --bg-dark: #0c0c0c;
            --bg-card: #1a1a1a;
            --bg-elevated: #242424;
            --text-primary: #fafafa;
            --text-secondary: #a3a3a3;
            --accent-orange: #f97316;
            --accent-purple: #a855f7;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
        }
        
        * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .gradient-text {
            background: linear-gradient(135deg, var(--primary-light), var(--primary), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card:hover { border-color: rgba(255,255,255,0.12); transform: translateY(-2px); }
        .card-static:hover { transform: none; }
        
        .superset-card {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.08), rgba(13, 148, 136, 0.08));
            border: 2px solid rgba(168, 85, 247, 0.3);
        }
        
        .timer-progress-bar { transition: width 0.5s linear; }
        .strikethrough { text-decoration: line-through; opacity: 0.4; }
        
        .tab-btn {
            transition: all 0.2s ease-in-out;
            position: relative;
        }
        
        .tab-btn::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }
        
        .tab-btn.active-tab::after { width: 100%; }
        .active-tab { color: var(--primary-light) !important; }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(13, 148, 136, 0.3);
        }
        
        .btn-generate {
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            position: relative;
            overflow: hidden;
        }
        
        .btn-generate::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn-generate:hover::before { left: 100%; }
        
        .btn-success {
            background: linear-gradient(135deg, var(--accent-green), #16a34a);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, var(--accent-red), #dc2626);
        }
        
        input[type="checkbox"] { accent-color: var(--primary); }
        
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary-light);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
        }
        
        .stat-box {
            background: var(--bg-elevated);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        
        .nav-tab {
            transition: all 0.2s ease;
            border-bottom: 2px solid transparent;
        }
        
        .nav-tab.active {
            border-bottom-color: var(--primary);
            color: var(--primary-light);
        }
        
        .saved-workout-card {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .saved-workout-card:hover {
            border-color: var(--primary);
        }
        
        .saved-workout-card.selected {
            border-color: var(--primary);
            background: rgba(13, 148, 136, 0.1);
        }
        
        .progress-bar-bg {
            background: var(--bg-elevated);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .progress-bar-fill {
            background: linear-gradient(90deg, var(--primary), var(--accent-purple));
            height: 100%;
            transition: width 0.3s ease;
        }
        
        .weight-input {
            background: var(--bg-elevated);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 6px 10px;
            width: 80px;
            color: white;
            text-align: center;
        }
        
        .weight-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .modal-overlay {
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(4px);
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #333; }
    </style>
</head>
<body>
    <!-- Timer Modal -->
    <div id="timer-modal" class="fixed inset-0 modal-overlay flex items-center justify-center z-50 hidden">
        <div class="card p-8 text-center w-80 sm:w-96">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-gradient-to-br from-teal-500/20 to-purple-500/20 flex items-center justify-center">
                <svg class="w-8 h-8 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <h2 class="text-xl font-bold text-teal-400 mb-2">REST TIME</h2>
            <p id="timer-display" class="mono text-7xl font-bold gradient-text mb-6">60</p>
            <div class="w-full bg-neutral-800 rounded-full h-2 overflow-hidden">
                <div id="timer-progress" class="bg-gradient-to-r from-teal-500 to-purple-500 h-2 rounded-full timer-progress-bar" style="width: 100%;"></div>
            </div>
            <button id="close-timer-btn" class="mt-8 bg-neutral-700 text-white font-semibold py-3 px-6 rounded-xl hover:bg-neutral-600 transition-colors w-full">SKIP</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 modal-overlay flex items-center justify-center z-50 hidden">
        <div class="card p-6 sm:p-8 w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold gradient-text">Generation Settings</h2>
                <button id="close-settings-btn" class="text-neutral-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-neutral-400 mb-2">Workout Name</label>
                    <input type="text" id="workout-name" placeholder="e.g., Week 1 - Strength Focus" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-neutral-400 mb-2">Focus Area</label>
                    <select id="focus-area" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-500">
                        <option value="">Balanced (Default)</option>
                        <option value="chest">Emphasize Chest</option>
                        <option value="back">Emphasize Back</option>
                        <option value="shoulders">Emphasize Shoulders</option>
                        <option value="arms">Emphasize Arms</option>
                        <option value="legs">Emphasize Legs</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-neutral-400 mb-2">Max Duration</label>
                    <select id="max-duration" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-500">
                        <option value="35">35 minutes</option>
                        <option value="40">40 minutes</option>
                        <option value="45" selected>45 minutes</option>
                        <option value="50">50 minutes</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-neutral-400 mb-2">Equipment</label>
                    <select id="equipment-pref" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-500">
                        <option value="full">Full Gym</option>
                        <option value="barbell">Barbell Focus</option>
                        <option value="dumbbell">Dumbbell Focus</option>
                        <option value="cables">Cables & Machines</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-neutral-400 mb-2">Intensity Technique</label>
                    <select id="intensity-technique" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-500">
                        <option value="standard">Standard Sets</option>
                        <option value="dropsets">Include Drop Sets</option>
                        <option value="restpause">Include Rest-Pause</option>
                        <option value="tempo">Tempo Training</option>
                        <option value="mixed">Mixed Techniques</option>
                    </select>
                </div>
                
                <button id="generate-with-settings" class="btn-generate w-full text-white font-bold py-4 px-6 rounded-xl transition-all">
                    Generate New Workout
                </button>

                <button id="reset-data-btn" class="w-full text-neutral-500 hover:text-red-400 text-sm font-medium py-2 transition-colors">
                    Reset all data &amp; history
                </button>

                <p id="app-build-stamp" class="text-center text-neutral-600 text-xs pt-1"></p>
            </div>
        </div>
    </div>

    <!-- Log Workout Modal -->
    <div id="log-modal" class="fixed inset-0 modal-overlay flex items-center justify-center z-50 hidden">
        <div class="card p-6 sm:p-8 w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold gradient-text">Log Workout</h2>
                <button id="close-log-btn" class="text-neutral-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <div id="log-exercises-container" class="space-y-4 mb-6">
                <!-- Exercise logging fields will be rendered here -->
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-neutral-400 mb-2">Session Notes (Optional)</label>
                    <textarea id="session-notes" rows="3" placeholder="How did you feel? Any adjustments made?" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-500 resize-none"></textarea>
                </div>
                
                <div class="flex gap-3">
                    <button id="save-log-btn" class="btn-success flex-1 text-white font-bold py-3 px-6 rounded-xl transition-all">
                        Save Workout Log
                    </button>
                    <button id="cancel-log-btn" class="bg-neutral-700 text-white font-semibold py-3 px-6 rounded-xl hover:bg-neutral-600 transition-colors">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- View Progress Modal -->
    <div id="progress-modal" class="fixed inset-0 modal-overlay flex items-center justify-center z-50 hidden">
        <div class="card p-6 sm:p-8 w-full max-w-3xl mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold gradient-text">Progress History</h2>
                <button id="close-progress-btn" class="text-neutral-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <div id="progress-content" class="space-y-6">
                <!-- Progress data will be rendered here -->
            </div>
        </div>
    </div>

    <!-- Saved Workouts Modal -->
    <div id="saved-modal" class="fixed inset-0 modal-overlay flex items-center justify-center z-50 hidden">
        <div class="card p-6 sm:p-8 w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold gradient-text">Saved Workouts</h2>
                <button id="close-saved-btn" class="text-neutral-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <div id="saved-workouts-list" class="space-y-3">
                <!-- Saved workouts will be rendered here -->
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container mx-auto max-w-5xl p-4 sm:p-6 lg:p-8">
        <!-- Header -->
        <header class="mb-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold gradient-text tracking-tight">Adaptive Hypertrophy Coach</h1>
                    <p class="text-neutral-400 text-sm mt-1">Progressive 4-day split • Track your gains</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button id="saved-btn" class="bg-neutral-800 text-white font-medium py-2 px-3 rounded-lg hover:bg-neutral-700 transition-colors flex items-center gap-1.5 text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path>
                        </svg>
                        Saved
                    </button>
                    <button id="progress-btn" class="bg-neutral-800 text-white font-medium py-2 px-3 rounded-lg hover:bg-neutral-700 transition-colors flex items-center gap-1.5 text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                        Progress
                    </button>
                    <button id="settings-btn" class="bg-neutral-800 text-white font-medium py-2 px-3 rounded-lg hover:bg-neutral-700 transition-colors flex items-center gap-1.5 text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                        </svg>
                        New
                    </button>
                </div>
            </div>
            
            <!-- Current Workout Info -->
            <div id="current-workout-info" class="card card-static p-4 mb-4">
                <p class="text-xs text-neutral-500 uppercase tracking-wider">Current Workout</p>
                <h2 id="current-workout-name" class="text-lg font-bold text-white">Week 1 - Hypertrophy Base</h2>
            </div>
            
            <!-- Stats Grid -->
            <div class="stats-grid mb-4">
                <div class="stat-box">
                    <p class="text-xs text-neutral-500 uppercase tracking-wider mb-1">Week</p>
                    <p id="week-number" class="mono text-xl font-bold text-teal-400">1</p>
                </div>
                <div class="stat-box">
                    <p class="text-xs text-neutral-500 uppercase tracking-wider mb-1">Logged</p>
                    <p id="logged-sessions" class="mono text-xl font-bold text-purple-400">0</p>
                </div>
                <div class="stat-box">
                    <p class="text-xs text-neutral-500 uppercase tracking-wider mb-1">Total Vol</p>
                    <p id="total-volume" class="mono text-xl font-bold text-orange-400">0</p>
                </div>
                <div class="stat-box">
                    <p class="text-xs text-neutral-500 uppercase tracking-wider mb-1">Streak</p>
                    <p id="workout-streak" class="mono text-xl font-bold text-green-400">0</p>
                </div>
            </div>
            
            <!-- Day Navigation -->
            <div id="day-navigation" class="flex flex-wrap justify-center gap-2 border-b border-neutral-800 pb-3">
                <!-- Tabs generated dynamically -->
            </div>
            
            <!-- Day Title -->
            <div class="text-center mt-4">
                <h2 id="workout-day-title" class="text-xl sm:text-2xl font-bold text-white"></h2>
                <p id="workout-day-details" class="text-neutral-400 mt-1 text-sm"></p>
            </div>
        </header>

        <!-- Workout Container -->
        <main id="workout-container" class="space-y-4 fade-in">
            <!-- Exercise cards rendered here -->
        </main>

        <!-- Inline Session Notes (only shown when a workout is loaded) -->
        <section id="inline-notes-section" class="mt-4 card card-static p-4 hidden">
            <label for="inline-session-notes" class="block text-xs font-medium text-neutral-500 uppercase tracking-wider mb-2">Session Notes</label>
            <textarea id="inline-session-notes" rows="2" placeholder="How did you feel? Any adjustments made?" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-teal-500 resize-none"></textarea>
        </section>

        <!-- Progression Notes -->
        <section id="progression-notes" class="mt-8 card card-static p-5 hidden">
            <h3 class="text-base font-bold text-teal-400 mb-2 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                </svg>
                Progression Notes
            </h3>
            <p id="progression-text" class="text-neutral-300 text-sm leading-relaxed"></p>
        </section>
    </div>

    <script>
        const WORKOUT_API_URL = "https://hypertrophy-coach-proxy.mgrayson638.workers.dev/generate-workout";

        // Bump on every deploy. Shown in the settings modal and logged to the
        // console so a stale cached build on any device is immediately obvious.
        const APP_BUILD = '2026-07-14.1 (variety-enforcement)';
        console.info('Hypertrophy Coach build:', APP_BUILD);
        document.addEventListener('DOMContentLoaded', () => {
            const stamp = document.getElementById('app-build-stamp');
            if (stamp) stamp.textContent = 'Build ' + APP_BUILD;
        });

        // ============================================
        // EXERCISE DATABASE
        // ============================================
        const ExerciseDatabase = {
  chest: {
    compound: [
      { name: 'Flat Barbell Bench Press', equipment: 'barbell', movementPattern: 'horizontalPush', primaryMuscle: 'chest', secondaryMuscles: ['triceps', 'front-delts'], unilateral: false, focus: 'Maintain a stable base, control the descent, and drive explosively. Keep elbows slightly tucked at 45 degrees.', alternative: 'Flat Dumbbell Press' },
      { name: 'Incline Barbell Press', equipment: 'barbell', movementPattern: 'inclinePush', primaryMuscle: 'chest', secondaryMuscles: ['front-delts', 'triceps'], unilateral: false, focus: 'Set bench to 30-45 degrees. Focus on upper chest engagement. Control the eccentric phase.', alternative: 'Incline Dumbbell Press' },
      { name: 'Flat Dumbbell Press', equipment: 'dumbbell', movementPattern: 'horizontalPush', primaryMuscle: 'chest', secondaryMuscles: ['triceps', 'front-delts'], unilateral: false, focus: 'Allow a deeper stretch at the bottom. Press dumbbells together at the top for peak contraction.', alternative: 'Flat Barbell Bench Press' },
      { name: 'Incline Dumbbell Press', equipment: 'dumbbell', movementPattern: 'inclinePush', primaryMuscle: 'chest', secondaryMuscles: ['front-delts', 'triceps'], unilateral: false, focus: 'Focus on squeezing your upper chest at the top. Control the weight throughout.', alternative: 'Incline Barbell Press' },
      { name: 'Decline Push-ups', equipment: 'bodyweight', movementPattern: 'horizontalPush', primaryMuscle: 'chest', secondaryMuscles: ['triceps', 'front-delts'], unilateral: false, focus: 'Elevate your feet to increase difficulty. Focus on engaging your lower chest.', alternative: 'Machine Chest Press' },
      { name: 'Machine Chest Press', equipment: 'machine', movementPattern: 'horizontalPush', primaryMuscle: 'chest', secondaryMuscles: ['triceps', 'front-delts'], unilateral: false, focus: 'Great for isolating chest without stabilizer fatigue. Focus on mind-muscle connection.', alternative: 'Flat Dumbbell Press' },
      { name: 'Decline Barbell Bench Press', equipment: 'barbell', movementPattern: 'declinePush', primaryMuscle: 'chest', secondaryMuscles: ['triceps'], unilateral: false, focus: 'Targets lower chest fibers. Keep a controlled descent to the lower sternum.', alternative: 'Machine Decline Press' },
      { name: 'Decline Dumbbell Press', equipment: 'dumbbell', movementPattern: 'declinePush', primaryMuscle: 'chest', secondaryMuscles: ['triceps'], unilateral: false, focus: 'Lower chest emphasis with a longer range of motion than the barbell version.', alternative: 'Decline Barbell Bench Press' },

        // ============================================
        // STATE MANAGEMENT
        // ============================================
        let appState = {
            weekNumber: 1,
            currentWorkout: null,
            currentWorkoutId: null,
            savedWorkouts: [],
            workoutLogs: [],
            exerciseProgress: {},
            settings: {
                focusArea: '',
                maxDuration: 45,
                equipmentPref: 'full',
                intensityTechnique: 'standard'
            }
        };

        function loadState() {
            const saved = localStorage.getItem('hypertrophyCoachState_v2');
            if (saved) {
                try {
                    appState = { ...appState, ...JSON.parse(saved) };
                } catch (e) {
                    console.log('Could not load saved state');
                }
            }
        }

        function saveState() {
            localStorage.setItem('hypertrophyCoachState_v2', JSON.stringify(appState));
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        // ============================================
        // LOGGING HELPERS
        // ============================================
        // Returns a YYYY-MM-DD key from a Date in local time so multiple
        // logs on the same calendar day collapse to one.
        function todayDateKey(date) {
            const d = date || new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        // Read-only lookup for today's log for a given workout + day. Returns
        // null if none exists yet. Used during render; we don't want to
        // create empty draft logs just because the user browsed a day tab.
        function getTodaysLog(workoutId, dayName) {
            const today = todayDateKey();
            return appState.workoutLogs.find(l =>
                l.workoutId === workoutId &&
                l.day === dayName &&
                todayDateKey(new Date(l.date)) === today
            ) || null;
        }

        // Get-or-create the today's log. Called from the first inline input
        // interaction so logs only materialize when the user actually engages.
        function getOrCreateTodaysLog(workoutId, dayName, dayTitle) {
            let log = getTodaysLog(workoutId, dayName);
            if (!log) {
                const workout = appState.savedWorkouts.find(w => w.id === workoutId);
                log = {
                    id: generateId(),
                    workoutId: workoutId,
                    workoutName: workout ? workout.name : 'Unknown',
                    day: dayName,
                    dayTitle: dayTitle,
                    date: new Date().toISOString(),
                    exercises: [],
                    notes: ''
                };
                appState.workoutLogs.push(log);
            }
            return log;
        }

        // Get-or-create an exercise entry inside a log, padded to targetSets.
        function getOrCreateLogExercise(log, exerciseName, targetSets) {
            let ex = log.exercises.find(e => e.name === exerciseName);
            if (!ex) {
                ex = { name: exerciseName, sets: [] };
                log.exercises.push(ex);
            }
            while (ex.sets.length < targetSets) {
                ex.sets.push({});
            }
            return ex;
        }

        // Returns the sets array of the most recent prior log containing
        // this exercise (with any real data). Used for ghost placeholders.
        function getLastSessionForExercise(name, excludeLogId) {
            for (let i = appState.workoutLogs.length - 1; i >= 0; i--) {
                const log = appState.workoutLogs[i];
                if (excludeLogId && log.id === excludeLogId) continue;
                const ex = log.exercises.find(e => e.name === name);
                if (ex && ex.sets.some(s => (s.weight || 0) > 0)) {
                    return ex.sets;
                }
            }
            return null;
        }

        // Recompute exerciseProgress entries for a single log's exercises.
        // Replaces any prior entry tied to this log's date so edits stay
        // consistent with the source of truth.
        function updateExerciseProgressForLog(log) {
            log.exercises.forEach(ex => {
                if (!appState.exerciseProgress[ex.name]) {
                    appState.exerciseProgress[ex.name] = [];
                }
                const maxWeight = Math.max(0, ...ex.sets.map(s => s.weight || 0));
                const maxReps = Math.max(0, ...ex.sets.map(s => s.reps || 0));
                appState.exerciseProgress[ex.name] =
                    appState.exerciseProgress[ex.name].filter(p => p.date !== log.date);
                if (maxWeight > 0) {
                    appState.exerciseProgress[ex.name].push({
                        date: log.date,
                        weight: maxWeight,
                        reps: maxReps
                    });
                }
            });
        }

        // A "logged" session is one where at least one set is marked done or
        // has actual weight recorded. Empty draft logs don't count.
        function isLoggedSession(log) {
            return log.exercises.some(ex =>
                ex.sets.some(s => s.completed || (s.weight || 0) > 0)
            );
        }

        // Walks the day's exercise definitions (including supersets) to find
        // an exercise by name. Used by the inline log handlers to discover
        // the prescribed set count.
        function findExerciseDef(dayData, name) {
            for (const item of dayData.exercises) {
                if (item.type === 'superset') {
                    const found = item.exercises.find(e => e.name === name);
                    if (found) return found;
                } else if (item.name === name) {
                    return item;
                }
            }
            return null;
        }

        // ============================================
        // WORKOUT GENERATION
        // ============================================
        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function shuffleArray(arr) {
            const newArr = [...arr];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        function filterByEquipment(exercises, pref) {
            if (pref === 'full') return exercises;
            const filtered = exercises.filter(ex => {
                if (pref === 'barbell') return ex.equipment === 'barbell' || ex.equipment === 'bodyweight';
                if (pref === 'dumbbell') return ex.equipment === 'dumbbell' || ex.equipment === 'bodyweight';
                if (pref === 'cables') return ex.equipment === 'cable' || ex.equipment === 'machine';
                return true;
            });
            return filtered.length > 0 ? filtered : exercises;
        }

        // Returns a copy of the full nested ExerciseDatabase with every exercise
        // array filtered to the given equipment preference. Used to trim the
        // payload sent to the coach so token cost stays roughly flat as the
        // library grows. 'full' returns the whole DB unchanged. filterByEquipment
        // never returns an empty array (falls back to the unfiltered list), so no
        // slot is ever wiped out.
        function buildFilteredDatabase(pref) {
            const out = {};
            for (const [group, sub] of Object.entries(ExerciseDatabase)) {
                out[group] = {};
                for (const [cat, arr] of Object.entries(sub)) {
                    out[group][cat] = filterByEquipment(arr, pref);
                }
            }
            return out;
        }

        function getRepScheme(isCompound, weekNum) {
            const schemes = {
                compound: [
                    { sets: 3, reps: '6-10' },
                    { sets: 4, reps: '8-10' },
                    { sets: 3, reps: '8-12' },
                    { sets: 4, reps: '6-8' }
                ],
                isolation: [
                    { sets: 3, reps: '10-15' },
                    { sets: 2, reps: '12-15' },
                    { sets: 3, reps: '12-15' },
                    { sets: 2, reps: '15-20' }
                ]
            };
            const pool = isCompound ? schemes.compound : schemes.isolation;
            return pool[(weekNum - 1) % pool.length];
        }

        function applyIntensityTechnique(exercise, technique) {

                dropsets: 'Last set is a double drop set.',
                restpause: 'Use rest-pause on final set.',
                tempo: 'Use 3-1-2-0 tempo.',

            let techNote = techniques[technique];
            if (technique === 'mixed') {
                techNote = getRandomItem(['Last set drop set.', 'Rest-pause final set.', '3 sec negative.']);
            }
            return { ...exercise, focus: exercise.focus + ' ' + techNote };
